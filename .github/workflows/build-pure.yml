# Proves the published `pcre2` package is pure OCaml: builds on a bare runner
# with NO libpcre2 installed and no dune-configurator, via plain opam.
name: build-pure

on:
  push:
    branches: [develop, "austin/pcre-ocaml-rewrite"]
  pull_request:

jobs:
  build-pure:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14", "5.2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Install pcre2 package deps only (no C libraries)
        run: opam install . --deps-only --with-test --ignore-pin-depends
      - name: Build the published package
        run: opam exec -- dune build -p pcre2
      # The pure Alcotest suites (engine per-module module-init asserts +
      # the pcre2 Interp/Jit functor suite) both build against pure deps
      # only (pcre2, pcre2.engine, alcotest) — no libpcre2, no C oracle —
      # so they run here. Building the @pure-tests alias runs the exes.
      - name: Pure Alcotest suites (engine asserts + pcre2 functor)
        run: opam exec -- dune build @pure-tests
